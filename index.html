<title>الكائنات الحية الدقيقة: الدرسان الثاني والثالث</title>
<style>
:root{--bg:#0f4c5c;--paper:#fffaf0;--ink:#1d2b33;--sun:#f6b73c;--coral:#e4572e;--mint:#2a9d8f;--sky:#3a86c8;--plum:#7b4fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a323d}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI","Noto Naskh Arabic",Arial,sans-serif;overflow:hidden}
#vp{position:absolute;inset:0 0 58px 0;overflow:hidden;background:radial-gradient(circle at 1px 1px,#ffffff22 1.5px,transparent 2px) 0 0/34px 34px,var(--bg)}
#st{position:absolute;left:0;top:0;width:4850px;height:3560px;transform-origin:0 0;transition:transform 1s cubic-bezier(.65,0,.25,1)}
.sc{position:absolute;width:1100px;height:800px;background:var(--paper);border:6px solid var(--c,var(--mint));border-radius:30px;overflow:hidden;display:flex;flex-direction:column;opacity:.45;transition:opacity .6s;scrollbar-width:thin}
.sc.on{opacity:1}
.cap{display:none;position:absolute;inset:0;background:var(--c);color:#fff;font-size:70px;font-weight:700;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:5;cursor:pointer}
.map .cap{display:flex}.map .sc{opacity:1}
.in{padding:22px 30px}
h2{margin:0 0 12px;font-size:38px;color:var(--c)}h2 b{display:inline-block;background:var(--c);color:#fff;border-radius:50%;min-width:44px;height:44px;line-height:44px;text-align:center;margin-inline-start:10px;font-size:24px}
h4{margin:12px 0 3px;font-size:23px;color:var(--c)}p,li{font-size:25px;line-height:1.65;margin:2px 0}ol{margin:0;padding-inline-start:26px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.obs{background:#fff3d6;border-radius:14px;padding:6px 14px;margin-top:8px}
.ans{display:none;background:linear-gradient(90deg,#fff4c2,#d9f6e6);border-radius:16px;border-inline-start:10px solid var(--sun);padding:10px 18px;margin-top:10px;color:#0b6b3a;font-size:27px;font-weight:700;line-height:1.6}.ans.show{display:block;animation:pop .6s,glow 1.6s .6s 3}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:0 10px;font-size:14px;margin-inline-end:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 22px;background:var(--c,var(--sun));color:#fff;font-size:23px;touch-action:manipulation;transition:transform .15s}button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.rev{background:var(--ink);margin-top:8px}
.mq{margin-top:10px;border-top:2px dashed #0002;padding-top:6px}.mq p{font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}.opts button{background:#fff;color:var(--ink);border:2px solid var(--c)}
.opts button.ok{background:#2e9e5b;color:#fff;animation:pop .5s}.opts button.no{background:#c0392b;color:#fff;animation:shake .4s}
.fb{font-weight:700;font-size:23px}.fb.g{color:#0a7a3b;font-size:29px;animation:pop .5s}.fb.r{color:#c0392b;font-size:26px;animation:shake .4s}.pic{margin:8px 0;text-align:center}.pic svg{width:100%;max-height:300px;background:#fff;border-radius:12px;border:2px solid #0002}.pic small{display:block;font-size:13px}
.figs{display:flex;gap:10px;flex-wrap:wrap}.figs div{text-align:center;font-size:14px}.fig{width:150px;height:90px;background:#fff;border-radius:10px;border:2px solid #0002}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border:2px solid #0003;padding:4px 8px;text-align:center}th{background:#fde7b0}
.warn{background:#ffe0d6;border:3px solid var(--coral);border-radius:12px;padding:4px 12px;font-weight:700}
.tree{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}.row{display:flex;gap:14px;justify-content:center}
.nd{border-radius:14px;padding:6px 14px;color:#fff;text-align:center;font-size:24px;background:var(--mint)}.nd small{display:block;font-size:18px;font-weight:400}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:6px;background:linear-gradient(160deg,#fffaf0,#fde7b0)}
.cover h1{font-family:"Simplified Arabic","Sakkal Majalla","Traditional Arabic","Noto Naskh Arabic",Tahoma,serif;font-weight:900;-webkit-text-stroke:1.5px var(--bg);font-size:86px;margin:6px 0;color:var(--bg);animation:pop 1s,glow 2s 1s infinite}.cover p{font-size:28px}.cover h3{font-size:34px!important}
#bar{position:absolute;inset:auto 0 0 0;height:58px;padding-bottom:env(safe-area-inset-bottom,0px);background:#0b3944;display:flex;align-items:center;gap:8px;padding-inline:12px;z-index:9}
#bar button{background:#ffffff1f;padding:6px 12px;font-size:16px}#bar button:hover{background:#ffffff40}
#pgw{flex:1;display:flex;align-items:center;gap:10px;color:#fff;font-size:15px;min-width:80px}#pg{flex:1;height:12px;background:#ffffff30;border-radius:8px;overflow:hidden}#pg i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s}
.hd{display:grid;grid-template-columns:.85fr 2.3fr .85fr;align-items:center;background:#0f4c5c;color:#fff;line-height:1.35}.hd>div{padding:8px 12px;border-inline-start:2px solid #ffffff55}.hd .c,.hd .l{white-space:nowrap}.hd>div:first-child{border:0}.hd small{display:block;font-size:14px;opacity:.85;font-weight:400}.hd .sn{display:block;font-size:25px;font-weight:700}.hd .tn{font-size:18px;font-weight:700;margin-top:2px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.hd .h1>div{flex:1}.hd>div{text-align:center}.hd .h1 .sn{font-size:26px;white-space:nowrap}.lab{background:#eef7ff;border:3px solid var(--c);border-radius:18px;padding:6px 16px;margin-top:10px}.items,.zones{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}.chip{display:inline-block;color:#fff;padding:8px 18px;border-radius:30px;font-size:23px;font-weight:700;cursor:grab;touch-action:none;user-select:none;box-shadow:0 3px 0 #0003}.chip.gh{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.9}.zone{flex:1;min-width:150px;min-height:96px;border:3px dashed var(--c);border-radius:16px;background:#fff;padding:6px;text-align:center;position:relative;overflow:hidden;transition:background .3s}.zone b{display:block;font-size:21px;color:var(--c);position:relative}.zone.hov{background:#fff3c2}.zone.heated{background:#ffb199}.zone.bad{animation:shake .4s}.zone .chip{margin:3px;cursor:default;font-size:19px;padding:4px 12px;position:relative}.wl{position:absolute;left:0;right:0;bottom:0;height:30%;background:#8ec5ee99;transition:height 1s}.zone.up .wl{height:62%}.oil{position:absolute;left:0;right:0;top:45%;height:14px;background:#e6b422;animation:pop .6s}.lm{min-height:36px;font-size:24px;font-weight:700}.lm.g{color:#0a7a3b;animation:pop .5s}.lm.r{color:#c0392b;animation:shake .4s}.lab small{font-size:14px}.lab .rs{padding:4px 14px;font-size:17px;background:var(--ink)}.hd b{color:#ffe9a8}.ft{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;background:var(--ink);color:#ffe9a8;padding:8px 22px;font-size:20px;font-weight:700}.bd{flex:1;overflow:auto;position:relative;scrollbar-width:thin}.bd>.cover{min-height:100%;height:auto}
.hd .sn,.hd .tn,.cover h3,.cover p:nth-of-type(-n+2){font-family:"Simplified Arabic","Sakkal Majalla","Traditional Arabic","Noto Naskh Arabic",Tahoma,serif;font-weight:900;-webkit-text-stroke:.7px currentColor}.cover p:nth-of-type(-n+2){font-size:32px}
.ft{display:grid;grid-template-columns:1fr auto 1fr}.ft span:last-child{text-align:left}
.ft .lt{font-size:21px;white-space:nowrap}.ft .mt{color:#ffd166;font-weight:900;font-size:21px;text-align:center;white-space:nowrap}
.lt{font-family:"Simplified Arabic","Sakkal Majalla","Traditional Arabic","Noto Naskh Arabic",Tahoma,serif;font-weight:900;font-size:24px;-webkit-text-stroke:.6px #ffe9a8}
body{font-family:"Simplified Arabic","Sakkal Majalla","Traditional Arabic","Noto Naskh Arabic",Tahoma,sans-serif}.bd p,.bd li,.bd h2,.bd h4,.ft,#bar,.lm,.fb,.chip,.opts button,.rev{font-weight:900;-webkit-text-stroke:.5px currentColor}
.in li:nth-child(5n+1){color:#0f4c5c}.in li:nth-child(5n+2){color:#a8321b}.in li:nth-child(5n+3){color:#1f5fa3}.in li:nth-child(5n+4){color:#5b3a82}.in li:nth-child(5n+5){color:#8a5a00}li::marker{color:var(--d);font-weight:900}.in h4:nth-of-type(even){color:var(--d)}.obs{border-inline-start:8px solid var(--d)}.obs h4,.zone b{color:var(--d)}.lab{border-color:var(--d)}.opts button{border-color:var(--d)}.mq p{color:#0f4c5c}
.cover h3{color:#c0392b}.cover p:nth-of-type(1){color:#1f5fa3}.cover p:nth-of-type(2){color:#7b4fa3}.cover p:nth-of-type(3){color:#2a9d8f}
.hd .c .sn{color:#ffd166}.hd .tn{color:#9be7d8}.hd .l .sn{color:#ffb4a2}.ft span:nth-child(1){color:#9be7d8}.ft span:nth-child(3){color:#ffb4a2}
.sim svg{touch-action:none}.dg{cursor:grab}.sm{min-height:36px;font-size:23px;font-weight:900;color:#0a7a3b}.sm.pp{animation:pop .5s}
.hd .h1{display:flex;align-items:center;justify-content:center;gap:14px}.lgs{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;flex:none}.lg{width:230px;height:230px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 6px 18px #0004;animation:pop .8s}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}@keyframes glow{0%,100%{box-shadow:0 0 0 0 #f6b73caa}50%{box-shadow:0 0 0 14px #f6b73c00}}
.sc.on .in>*:not(.ans){animation:up .7s both}.sc.on .in>*:nth-child(2){animation-delay:.1s}.sc.on .in>*:nth-child(3){animation-delay:.2s}.sc.on .in>*:nth-child(4){animation-delay:.3s}.sc.on .in>*:nth-child(5){animation-delay:.4s}.sc.on .in>*:nth-child(6){animation-delay:.5s}
@media (max-width:760px){#bar{overflow-x:auto}#bar button{padding:6px 9px;font-size:15px;white-space:nowrap}#pg{display:none}#pgw{white-space:nowrap;font-size:13px}}.pt .g2{grid-template-columns:1fr}.pt .hd{grid-template-columns:1fr 1fr}.pt .h1{grid-column:1/-1;border-bottom:2px solid #ffffff55!important}.pt .hd .sn{font-size:25px}.pt .hd .c .sn{font-size:24px}
@media (prefers-reduced-motion:reduce){#st{transition:none}*{animation:none!important}}
</style>

<body>
<div id="vp"><div id="st"></div></div>
<div id="bar">
<button data-a="prev">‹ السابق</button><button data-a="map">الخريطة</button><button data-a="next">التالي ›</button>
<button data-a="zin" title="تكبير">＋</button><button data-a="zout" title="تصغير">－</button>
<div id="pgw"><span id="lb"></span><div id="pg"><i></i></div></div>
<button data-a="fs" id="fsb">ملء الشاشة</button><button data-a="home">البداية من جديد</button>

<script>
const $=s=>document.querySelector(s),A=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let W=1100,H=800,GX=1250,GY=920;const N=18,CL=['#2a9d8f','#e4572e','#3a86c8','#7b4fa3','#d98e04'];
let cur=0,zoom=1,map=false,seen=new Set([0]);
const dot=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="9" fill="${c}" stroke="#0004"/>`;
function fig(k){let s='<svg class="fig" viewBox="0 0 150 90">';for(let r=0;r<3;r++)for(let c=0;c<5;c++){const x=20+c*28,y=18+r*27;
if(k=='mix')s+=dot(x,y,(r+c*2)%3?'#e4572e':'#2a9d8f');
else if(k=='comp'){if(c<4&&c%2==0)s+=`<line x1="${x}" y1="${y}" x2="${x+28}" y2="${y}" stroke="#333" stroke-width="3"/>`+dot(x,y,'#e4572e')+dot(x+28,y,'#2a9d8f')}
else s+=dot(x,y,'#e4572e')}return s+'</svg>'}
const ACT2=[
{t:'كائنات مجهرية',q:'ماذا أشاهد على كفّ يدي بالعدسة المكبّرة؟ وماذا ينمو على طبق بتري بعد أن تلامسه اليد؟',tools:'طبق بتري فيه وسط غذائي، حاضنة، مجهر ضوئي (كما في صور الكتاب).',steps:['أتفحّص كفّ يدي بالعين المجرّدة ثم بالعدسة المكبّرة وأسجّل ما أشاهده.','أدرس مخطّط الباحثة: طبق فيه وسط غذائي، اليد تلامسه، الطبق في الحاضنة، الطبق بعد أسبوع، فحص عيّنة بالمجهر.','أجيب: ما المادة في الطبق وما أهميتها؟ ولماذا نضع الطبق في الحاضنة؟ وما التغيّرات والعوامل التي أثّرت؟','أكتب بلغتي تعريفًا للكائنات الحية الدقيقة.'],obs:'أسجّل ما أراه على كفّي، ثم التغيّرات على الطبق بعد أسبوع (ملاحظاتك أنت).',tg:'إضافة تعليمية',ans:'الطبق فيه وسط غذائي تحتاجه الكائنات الدقيقة لتنمو. الحاضنة توفّر درجة الحرارة المناسبة للنمو والتكاثر. بعد أسبوع ظهرت مستعمرات لم تكن مرئية لأن الكائنات تكاثرت. العوامل التي توفّرت: غذاء (الوسط الغذائي) ودرجة حرارة مناسبة. الكائنات الحية الدقيقة: كائنات حيّة لا تُرى بالعين المجرّدة ونحتاج المجهر لرؤيتها.',mq:['نضع طبق بتري في الحاضنة لأنها توفّر:',['حرارة مناسبة للنمو','ضوءًا قويًا فقط','هواءً باردًا'],0]},
{t:'عتبة الحياة',q:'لماذا يصف العلماء الفيروسات بأنها «عتبة الحياة»؟',tools:'نص الكتاب، صور الفيروسات بالمجهر الإلكتروني، نموذج التركيب العام للفيروس.',steps:['أقرأ النص وأتأمّل أشكال الفيروسات: كروي، لولبي اسطواني، مُذنَّب.','أكتب أمثلة لأمراض تسبّبها الفيروسات للإنسان والنبات والحيوان.','أبيّن لماذا لا يمكن رؤيتها بالمجهر الضوئي المركّب، وأكتب تعريفًا للفيروسات.','مشروع: أصمّم مع زملائي نموذجًا لأحد الفيروسات من خامات البيئة.'],obs:'من الكتاب: تتجمّع أكثر من ١٠٠٠٠٠ فيروس لتوازي علامة النقطة، ولهذا نحتاج مجهرًا إلكترونيًا.',tg:'من الكتاب + إضافة',ans:'الفيروسات «لا خلوية» ولا تُبدي نشاطًا حيويًا إلا داخل خلايا حيّة، تتطفّل عليها وتتكاثر داخلها، فهي على عتبة الحياة. لا تُرى بالمجهر الضوئي لشدّة صغرها. كل فيروس متخصّص بنوع من الخلايا، فلا يسبّب فيروس الرشح شلل الأطفال.',mq:['الفيروسات لا تُبدي نشاطًا حيويًا إلا:',['داخل خلايا حيّة','في الماء النقي','في الهواء الجاف'],0]},
{t:'حياة في قطرة ماء',q:'ماذا يوجد في قطرة من ماء بركة راكدة؟ وكيف يصنّف العلماء ما نشاهده؟',tools:'شريحة جاهزة لقطرة ماء من بركة راكدة، مجهر ضوئي، بمساعدة المعلم.',steps:['بمساعدة معلّمي أضع الشريحة على المنضدة.','أفحصها بالعدسة الشيئية الصغرى أولًا ثم الأكبر، وأرسم بعض ما أشاهد.','أقارن ما شاهدته بصور الكتاب: أميبا، براميسيوم، يوجلينا، طحلب، بكتيريا.','أدرس الخريطة المفاهيمية وأكتب نصًا علميًا عن تصنيف الكائنات الحية الدقيقة.'],obs:'أرسم ما أشاهده وأذكر أوجه الشبه والاختلاف بين الكائنات (رسمك أنت).',tg:'من الكتاب + إضافة',ans:'أستنتج: الكائنات الحية الدقيقة صغيرة جدًا فيصعب دراستها. صنّفها العلماء إلى بدائيات (مثل البكتيريا) وطلائعيات (الأوليات والطحالب) وفطريات.',mq:['تُصنَّف الكائنات الحية الدقيقة في الكتاب إلى:',['بدائيات وطلائعيات وفطريات','نباتات وحيوانات فقط','صخور ومعادن'],0]},
{t:'البدائيات (البكتيريا)',q:'ما أشكال البكتيريا؟ وبماذا تختلف الخضراء المزرقة عن غيرها؟',tools:'صور البكتيريا بالمجهر الإلكتروني: عصوية، كروية، حلزونية، كروية مسبّحية.',steps:['أتأمّل الصور وأسمّي أشكال البكتيريا.','أفسّر سبب تسمية هذه الكائنات بالبدائيات.','أبيّن بماذا تختلف الخضراء المزرقة عن بقية الأنواع، وأفسّر تواجد البكتيريا في كل مكان.','أكتب بلغتي تعريفًا للبدائيات.'],obs:'أدوّن الأشكال الأربعة وأيّها خضراء مزرقة.',tg:'من الكتاب + إضافة',ans:'الأشكال: عصوية، كروية، حلزونية، كروية مسبّحية (خضراء مزرقة). الخضراء المزرقة تصنع غذاءها بنفسها. تفسيران مقترحان (إضافة): تُسمّى «بدائيات» لأن خلاياها بدائية النواة، أي مادتها الوراثية غير محاطة بغشاء نووي. وتتواجد في كل مكان لأنها صغيرة جدًا وتتكاثر بسرعة وتتحمّل ظروفًا مختلفة.',mq:['تختلف البكتيريا الخضراء المزرقة بأنها:',['تصنع غذاءها بنفسها','لا تُرى بالمجهر أبدًا','تعيش في الحاضنة فقط'],0]},
{t:'الطلائعيات',q:'كيف تتحرك الأوليات؟ وما الطحالب؟',tools:'صور الأوليات (تريبانوسوما، براميسيوم، أميبا، بلازموديوم) وصور الطحالب (كلاميدوموناس، سبيروجيرا، باندورينا) من سور عكا.',steps:['أقرأ أسماء الأوليات وأكتب وسيلة الحركة لكل منها.','أفسّر لماذا تحتاج الأوليات إلى وسط سائل، وسبب تسميتها، وأكتب تعريفًا.','طحالب سور عكا: أقارن طُحلب الكلاميدوموناس وطُحلب السبيروجيرا من حيث عدد الخلايا.','أفسّر لماذا لون معظم الطحالب أخضر، وأكتب تعريفًا للطحالب.'],obs:'أكتب وسيلة حركة كل كائن وأقارن بين الطحلبين.',tg:'من الكتاب + إضافة',ans:'التريبانوسوما: سوط. البراميسيوم: أهداب. الأميبا: أقدام كاذبة. البلازموديوم: ينزلق (حركة انزلاقية دون سوط أو أهداب أو أقدام كاذبة). تحتاج الأوليات إلى وسط سائل لأنها تتحرك وتتغذّى فيه. تُسمّى أوليات لأنها وحيدة الخلية وتشبه الحيوانات في حركتها وتغذيتها (إضافة تعليمية). معظم الطحالب خضراء لاحتوائها صبغة اليخضور التي تصنع بها غذاءها بالضوء. الكلاميدوموناس خلية واحدة بينما السبيروجيرا خيوط من خلايا كثيرة.',mq:['الكائن الذي يتحرك بالأهداب:',['البراميسيوم','الأميبا','التريبانوسوما'],0]},
{t:'الفطريات',q:'ما المشترك بين فطر الخميرة وعفن الخبز وعيش الغراب؟',tools:'صور الفطريات، قطعة خبز متعفّنة، عدسة مكبّرة.',warn:'انتبه: لا أتناول الجزء السليم من الخضروات والفواكه المتعفّنة، بل أتخلّص منها كلّها.',steps:['أتأمّل مجموعات الصور وأجيب: ما المشترك بينها؟ وهل هي متشابهة في عدد الخلايا؟','أحضر قطعة خبز متعفّنة وأفحصها بالعدسة، وأصف ما أشاهد وأرسمه.','أقرأ «معلومة مفيدة»: الفطريات غير ذاتية التغذية: ترمّم وتطفّل وتكافل.','أكتب بلغتي تعريفًا للفطريات.'],obs:'أصف الخبز المتعفّن وأرسم ما أشاهده بالعدسة.',tg:'من الكتاب + إضافة',ans:'المشترك: كلها فطريات. الترمّم: التغذّي على الكائنات الحية الأخرى بعد موتها. التطفّل: التغذّي على كائن حيّ وتسبيب المرض أو الموت له. التكافل: التعايش مع كائن آخر يستفيد كلٌّ منهما. (الخميرة خلية واحدة وعفن الخبز خيوط، مقارنة مقترحة).',mq:['فطر يتغذّى على الكائنات بعد موتها يُسمّى:',['مترمّمًا','متطفّلًا','متكافلًا'],0]}];

{t:'نحو جسم سليم',q:'كيف يعزّز التطعيم قدرة الجسم على مقاومة الأمراض؟',tools:'بطاقة التطعيم الخاصة بي (كتيّب صحة الأم والطفل).',steps:['أحضر بطاقة التطعيم الخاصة بي وأتفحّصها.','أجيب: لماذا توفّر وزارة الصحة بطاقة تطعيم لكل فرد في المجتمع؟','أكتب ثلاثة أسماء لأمراض وردت في البطاقة، وهل أُصبت يومًا بمرض؟','أصف الخلل في وظيفة أحد أجزاء الجسم عند الإصابة بالمرض، وأكتب مع زميلي تعريفًا للمرض.'],obs:'أسجّل أسماء الأمراض الواردة في بطاقتي (قيم من بطاقتك أنت).',tg:'من الكتاب + إضافة',ans:'تُوفَّر البطاقة لمتابعة تطعيم كل فرد وحمايته من الأمراض (إجابة مقترحة). المناعة: قدرة الجسم على مقاومة مسبّبات الأمراض ومنعها من إحداث خلل بأعضائه، وهي فطرية أو مكتسبة. التطعيم: إكساب الجسم مناعة ضد المسبّبات، ونوعاه اللقاحات والأمصال.',mq:['نوعا التطعيم هما:',['اللقاحات والأمصال','المجاهر والعدسات','الأطعمة والمشروبات'],0]},
{t:'أثر الفيروسات في الحياة',q:'ما الكائنات التي تصيبها الفيروسات؟ وما أثر ذلك؟',tools:'صور فيروسات: جدري الماء، شلل الأطفال، تبرقش البندورة والبطاطا، الحمّى القلاعية، إنفلونزا الطيور.',warn:'انتبه: لا أقترب من جثث الحيوانات المتحلّلة (كالطيور والقطط)، وتُدفن الحيوانات الميتة حفاظًا على البيئة.',steps:['أتأمّل الصور وأصنّف الفيروسات: تصيب الإنسان أو النبات أو الحيوان.','أجيب: ما أثر الفيروسات على الكائنات الحية؟','أفكّر وأناقش: لماذا يسبّب انتشار الأمراض الفيروسية خسارة اقتصادية لبلدي؟','أبحث عن الفيروسات الصديقة وأكتب تقريرًا.'],obs:'أدوّن مثالًا لكل مجموعة وما يسبّبه.',tg:'من الكتاب + إضافة',ans:'تُصيب الفيروسات الإنسان (جدري الماء، شلل الأطفال) والنبات (تبرقش البندورة والبطاطا) والحيوان (الحمّى القلاعية، إنفلونزا الطيور). أثرها: أمراض، وخسائر بتلف المحاصيل وموت الحيوانات (إجابة مقترحة).',mq:['فيروس تبرقش البندورة يصيب:',['النبات','الإنسان','الحيوان'],0]},
{t:'أثر البدائيات (البكتيريا)',q:'أين أجد أثر البكتيريا النافع والضار في حياتي؟',tools:'صور: منتجات الألبان، المخلّلات، تسوّس الأسنان، مرض الإنسان، طعام فاسد.',steps:['أتأمّل الصور وأناقشها مع زملائي في المجموعة.','أكتب بلغتي ملخّصًا حول أثر البكتيريا في الحياة.','أفكّر وأناقش: لماذا نقرأ تاريخ الإنتاج والانتهاء؟ وما علامات فساد الغذاء الأخرى؟','أبحث: دور البكتيريا في التخلّص من بقع النفط وتحلّل الجثث ومعالجة المياه العادمة.'],obs:'أصنّف ما أراه في الصور إلى أثر نافع وأثر ضار.',tg:'من الكتاب + إضافة',ans:'نافعة: صناعة الألبان والأجبان والمخلّلات، والتخلّص من بقع النفط، وتحلّل الجثث، ومعالجة المياه العادمة. ضارّة: تسوّس الأسنان، الأمراض، فساد الغذاء.',mq:['من أثر البكتيريا النافع:',['صناعة اللبن والأجبان','تسوّس الأسنان','فساد الطعام'],0]},
{t:'أثر الطلائعيات',q:'ما أمراض الأوليات؟ وما أثر الطحالب النافع والضار؟',tools:'المجلّة العلمية عن الأوليات (الملاريا والزحار الأميبي)، وصور آثار الطحالب.',steps:['أقرأ المجلّة: يوجد في البيئة أكثر من ٣٠٠٠٠ نوع من الأوليات.','أكمل الجدول: المسبّب، الأعراض، طريقة الانتقال، الخلايا التي يهاجمها.','أفسّر عبارة الكتاب «معظم الأوليات ضارّة»، وأذكر أوليات نافعة، وأقترح طرق الوقاية من أمراضها.','أتأمّل صور الطحالب: ما فوائدها وأضرارها؟ ولماذا تظهر بألوان مختلفة؟'],obs:'أملأ جدول المرضين ثم أصنّف أثر الطحالب.',tg:'من الكتاب + إضافة',ans:'الملاريا: يسبّبها البلازموديوم، من أعراضها البرد والصداع وارتفاع الحرارة وفقر الدم، وتنتقل ببعوضة الأنوفيليس الأنثى. الزحار الأميبي: تسبّبه أميبا (إنتاميبا هستوليتيكا)، أعراضه إسهال وألم شديد وضعف عام، وينتقل بالخضروات والفواكه والمياه الملوّثة ويستقر في الأمعاء. الخلايا المهاجَمة (إضافة): الملاريا تهاجم خلايا الدم الحمراء، والزحار الأميبي يصيب بطانة الأمعاء. كثير من الأوليات يتطفّل فيسبّب الأمراض، ومنها ما هو نافع إذ يشكّل غذاءً للكائنات البحرية وتدخل بقاياه في تكوّن الحجر الجيري. الوقاية: غسل الخضروات والفواكه، وشرب ماء نظيف، ومكافحة البعوض. الطحالب: تصنيع أدوية وأطعمة والوقاية من تسوّس الأسنان، ويُستخلص الآجار (وسط أطباق بتري) من بعضها؛ وضررها تسمّم الأسماك وتلوّث خزانات المياه؛ وتتنوّع ألوانها لاختلاف أصباغها.',mq:['تنتقل الملاريا إلى الإنسان بواسطة:',['بعوضة الأنوفيليس','الخضروات الملوّثة','ماء نظيف'],0]},
{t:'أثر الفطريات',q:'ما أثر الفطريات النافع والضار؟',tools:'صور: فطر البنسيليوم، عيش الغراب، القدم الرياضي، الخميرة، صدأ القمح.',steps:['أتأمّل الصور وأجيب.','أكمل المخطّط: أثر نافع وأثر ضارّ مع أمثلة.','أكوّن ثلاث جمل مفيدة عن المخطّط.','رأى جهاد فطريات تحت الأشجار فنصحه معلّمه بعدم أكلها: لماذا؟'],obs:'أضع أمثلة الصور في خانتي النافع والضار.',tg:'من الكتاب + إضافة',ans:'نافع: البنسيليوم (دواء البنسلين)، الخميرة (الخبز)، عيش الغراب غير السامّ (غذاء). ضارّ: عفن الفواكه، القدم الرياضي، صدأ القمح. بعض الفطريات سامّة، فلا نأكل فطرًا نجهله.',mq:['فطر الخميرة يُستخدم في:',['صناعة الخبز','تسوّس الأسنان','علاج الملاريا'],0]},
{t:'أكتشف أثر الخميرة',q:'أيّ عجين يتغيّر حجمه ولماذا؟',tools:'طحين، ماء دافئ، وعاءان، سكّر، خميرة.',steps:['وعاء ١: كوب طحين مع ملعقة خميرة وقليل من السكّر، وأعجنه بالماء الدافئ.','وعاء ٢: كوب طحين وقليل من السكّر بلا خميرة، وأعجنه بالماء الدافئ.','أتركهما في مكان دافئ ساعة وأراقب ما يحدث للعجين.','أحدّد العوامل التي ساعدت الخميرة على النمو، وما أثرها في الحياة.'],obs:'أسجّل حجم العجين في كل وعاء قبل الانتظار وبعده (ملاحظاتك أنت).',tg:'إضافة تعليمية (النتيجة تتحقق بالتجربة)',ans:'المتوقع: يكبر عجين الوعاء الذي فيه الخميرة ولا يتغيّر الآخر. الخميرة فطر وحيد الخلية يتغذّى على السكّر وينتج غاز ثاني أكسيد الكربون الذي ينفخ العجين. تنمو بوجود الغذاء (السكّر) والدفء والماء (الدافئ لا الساخن، فالحرارة العالية تقتلها)، وأثرها نافع في صناعة الخبز.',mq:['العجين الذي يكبر حجمه فيه:',['خميرة','طحين فقط','ماء بارد'],0]}];

const MT=['ابدأ رحلة العلم بفضول وشغف','من يعرف هدفه يصل إلى قمته','اسأل وجرّب واكتشف بنفسك','التفكير المنظّم بداية الإبداع','دقّق النظر تكتشف الفرق','كل تجربة خطوة نحو الاكتشاف','في الاختلاف جمال وتنوّع','الملاحظة الدقيقة سرّ العلماء','حروف قليلة وإبداع بلا حدود','كل عظيم يبدأ من لبنة صغيرة','لكلٍّ منّا ما يميّزه ويبدع به','الاتحاد قوّة والتعاون إبداع','بالتعاون نصنع شيئًا جديدًا','اجمع المعرفة وابتكر الجديد','ما تعلّمتَه اليوم يصنع غدك','ثق بنفسك فأنت مبدع'];

const SC=[];
SC.push(`<div class="cover"><img class="lg" alt="شعار مدرسة ذكور طمون الأساسية العليا" src="${LOGO}"><h3 style="margin:0;font-size:26px">مدرسة ذكور طمون الأساسية العليا</h3><p>المبحث: العلوم والحياة · الصف السادس الأساسي</p><p>الوحدة الأولى: الكائنات الحية الدقيقة</p><h1 style="font-size:54px">تصنيف الكائنات الحية الدقيقة<br>وأثرها في الحياة</h1><p>رحلة بين النشاطات: ننتقل بين المشاهد ونقرّب ونبعّد على الخريطة</p><div><button data-a="next" style="background:var(--coral)">ابدأ الرحلة</button> <button data-a="map" style="background:var(--bg)">افتح الخريطة</button></div></div>`);
SC.push(`<div class="in"><h2><b>١</b> أهداف التعلّم والتمهيد</h2><h4>أتعلّم في هذا الدرس أن:</h4><ol><li>أصف الكائنات الحية الدقيقة وأبيّن لماذا نحتاج المجهر.</li><li>أعرّف الفيروسات وأبيّن أنها «عتبة الحياة».</li><li>أصنّف الكائنات الحية الدقيقة إلى بدائيات وطلائعيات وفطريات.</li><li>أميّز أشكال البكتيريا ووسائل حركة الأوليات وأذكر أمثلة للطحالب والفطريات.</li></ol><h4>تمهيد من الحياة اليومية</h4><p>هل نرى كل ما حولنا بأعيننا؟ ماذا يحدث لطبق فيه غذاء إذا لمسته يد غير مغسولة؟</p><button class="rev" data-a="rev">اكشف الإجابة</button><div class="ans"><span class="tag">إضافة تعليمية</span>لا نرى كل شيء؛ فهناك كائنات دقيقة جدًا تنمو وتتكاثر، وسنتعرّف الآن كيف نكتشفها ونصنّفها.</div><p style="font-size:14px;opacity:.8">المصدر: كتاب العلوم والحياة للصف السادس، الوحدة الأولى، الدرس الثاني (ص ٨–٢٠). أماكن الكتابة فارغة في الكتاب، لذا الإجابات المقترحة موسومة «إضافة تعليمية» وليست من الكتاب، والملاحظات تسجّلها أنت.</p></div>`);
const AC=(a,k)=>{const n=a.n;SC.push(`<div class="in"><h2><b>${A(n)}</b> نشاط (${A(n)}): ${a.t}</h2><div class="g2"><div><h4>السؤال</h4><p>${a.q}</p><h4>الأدوات والمواد</h4><p>${a.tools}</p>${a.warn?`<div class="warn">${a.warn}</div>`:''}<div class="obs"><h4>الملاحظة</h4><p>${a.obs}</p></div></div><div>${SIMK[k]?SIM(SIMK[k]):''}<h4>خطوات العمل</h4><ol>${a.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${SIMK[k]?'':(IMG[k]||'')}${a.f?`<div class="figs">${a.f.map(k=>`<div>${fig(k)}<br>${F[k]}</div>`).join('')}</div><p style="font-size:13px">رسم توضيحي للجسيمات وليس صورة تجربة.</p>`:''}</div></div>${LAB(k)}<button class="rev" data-a="rev">اكشف الإجابة</button><div class="ans"><span class="tag">${a.tg}</span>${a.ans}</div><div class="mq" data-i="${k}"><p>سؤال سريع: ${a.mq[0]}</p><div class="opts">${a.mq[1].map((o,j)=>`<button data-a="opt" data-o="${j}">${o}</button>`).join('')}</div><div class="fb"></div></div></div>`)};
const LN=i=>i==0||i==17?'الدرسان الثاني والثالث':i<=8?'الدرس الثاني: تصنيف الكائنات الحية الدقيقة':'الدرس الثالث: أثر الكائنات الحية الدقيقة في الحياة';
for(let k=0;k<6;k++)AC(ACT[k],k);
SC.push(`<div class="in"><h2><b>٧</b> الملخص البصري</h2><div class="tree"><div class="nd" style="background:var(--bg)">الكائنات الحية الدقيقة</div><div class="row"><div><div class="nd" style="background:var(--mint)">بدائيات</div><div class="row" style="margin-top:8px"><div class="nd" style="background:var(--coral)">بكتيريا حقيقية</div><div class="nd" style="background:var(--sky)">خضراء مزرقة</div></div></div><div><div class="nd" style="background:var(--plum)">طلائعيات</div><div class="row" style="margin-top:8px"><div class="nd" style="background:#d98e04">أوليات<small>أميبا، براميسيوم</small></div><div class="nd" style="background:#2e7d32">طحالب<small>سبيروجيرا</small></div></div></div><div><div class="nd" style="background:#6b7b83">فطريات<small>خميرة، عفن الخبز</small></div></div></div></div><p>الفيروسات «لا خلوية» تنشط داخل الخلايا الحية فقط وتُرى بالمجهر الإلكتروني.</p><button data-a="next" style="background:var(--coral)">ابدأ الدرس الثالث</button></div>`);
SC.push(`<div class="in"><h2><b>١</b> أهداف التعلّم والتمهيد</h2><h4>أتعلّم في هذا الدرس أن:</h4><ol><li>أوضّح دور التطعيم والمناعة في الوقاية من الأمراض.</li><li>أبيّن أثر الفيروسات في الإنسان والنبات والحيوان.</li><li>أذكر الأثر النافع والضار للبدائيات والطلائعيات والفطريات.</li><li>أجرّب أثر الخميرة وأستنتج العوامل التي تساعدها على النمو.</li></ol><h4>تمهيد من الحياة اليومية</h4><p>هل كل الكائنات الدقيقة ضارّة؟ ما الذي يجعل اللبن لبنًا والخبز منتفخًا؟</p><button class="rev" data-a="rev">اكشف الإجابة</button><div class="ans"><span class="tag">إضافة تعليمية</span>لا؛ لبعضها فوائد كبيرة (كالبكتيريا في الألبان والخميرة في الخبز)، ولبعضها أضرار (كالأمراض)، وسنكتشف ذلك الآن.</div><p style="font-size:14px;opacity:.8">المصدر: كتاب العلوم والحياة للصف السادس، الوحدة الأولى، الدرس الثالث (ص ٢١–٣٣). أماكن الكتابة فارغة في الكتاب، لذا الإجابات المقترحة موسومة «إضافة تعليمية» وليست من الكتاب، والملاحظات تسجّلها أنت.</p></div>`);
for(let k=6;k<12;k++)AC(ACT[k],k);
SC.push(`<div class="in"><h2><b>٧</b> الملخص البصري</h2><div class="tree"><div class="nd" style="background:var(--bg)">أثر الكائنات الحية الدقيقة</div><div class="row"><div class="nd" style="background:var(--coral)">فيروسات<small>أمراض وخسائر اقتصادية</small></div><div class="nd" style="background:var(--mint)">بدائيات<small>نافع: ألبان ومخلّلات · ضار: تسوّس وفساد</small></div><div class="nd" style="background:var(--plum)">طلائعيات<small>ملاريا وزحار · طحالب نافعة وضارّة</small></div><div class="nd" style="background:#d98e04">فطريات<small>نافع: خميرة وبنسلين · ضار: صدأ القمح</small></div></div></div><p>التطعيم يمنح الجسم مناعة، وبعض الكائنات الدقيقة نافعة وبعضها ضارّ.</p><button data-a="go" data-n="17" style="background:var(--coral)">ابدأ التقويم</button></div>`);
SC.push(`<div class="in" id="quiz"></div>`);
let qi=0,qs=0,wrong=[];
function quiz(){const q=$('#quiz');if(qi>=Q.length){const p=Math.round(qs/Q.length*100);q.innerHTML=`<h2><b>★</b> النتيجة</h2><p style="font-size:30px"><b>${A(qs)} من ${A(Q.length)}</b> (${A(p)}٪)</p><p>${p>=80?'ممتاز! أتقنتَ الدرسين الثاني والثالث.':p>=50?'جيد! راجع النشاطات التي أخطأت فيها.':'حاول مرة أخرى بعد مراجعة النشاطات.'}</p>${wrong.length?`<h4>للمراجعة:</h4><ul>${wrong.map(w=>`<li>${w}</li>`).join('')}</ul>`:''}<button data-a="qr">أعد التقويم</button>`;return}
const x=Q[qi];q.innerHTML=`<h2><b>★</b> التقويم الختامي (${A(qi+1)} من ${A(Q.length)})</h2><p style="font-size:22px"><b>${x[0]}</b></p><div class="opts">${x[1].map((o,j)=>`<button data-a="qo" data-o="${j}">${o}</button>`).join('')}</div><div class="fb"></div>`}
function cam(){const vp=$('#vp'),vw=vp.clientWidth,vh=vp.clientHeight;let k,cx,cy;
if(map){const SW=3*GX+W,SH=4*GY+H;k=Math.min(vw/SW,vh/SH)*.97;cx=SW/2;cy=SH/2}else{k=Math.min(vw/(W+40),vh/(H+30))*zoom;cx=(3-cur%4)*GX+W/2;cy=Math.floor(cur/4)*GY+H/2}
$('#st').style.transform=`translate(${vw/2-cx*k}px,${vh/2-cy*k}px) scale(${k})`;vp.classList.toggle('map',map);
document.querySelectorAll('.sc').forEach((s,i)=>s.classList.toggle('on',i==cur));
$('#pg i').style.width=seen.size/N*100+'%';$('#lb').textContent=map?'خريطة الدرس':`المشهد ${A(cur+1)} من ${A(N)}`}
function go(i){cur=Math.max(0,Math.min(N-1,i));map=false;zoom=1;seen.add(cur);cam()}
const T=['الغلاف','أهداف الدرس الثاني',...ACT.slice(0,6).map(a=>`نشاط ${A(a.n)}: ${a.t}`),'ملخص الدرس الثاني','أهداف الدرس الثالث',...ACT.slice(6).map(a=>`نشاط ${A(a.n)}: ${a.t}`),'ملخص الدرس الثالث','التقويم'];
$('#st').innerHTML=SC.map((h,i)=>`<section class="sc" data-i="${i}" style="left:${(3-i%4)*GX}px;top:${Math.floor(i/4)*GY}px;--c:${CL[i%5]};--d:${CL[(i+2)%5]}"><div class="cap">${T[i]}</div><div class="hd"><div class="c"><span class="sn">العلوم والحياة</span></div><div class="h1"><div><span class="sn">مدرسة ذكور طمون الأساسية العليا</span><div class="tn"><span>الوحدة الأولى: الكائنات الحية الدقيقة</span><span>${LN(i)}</span></div></div></div><div class="l"><span class="sn">السادس الأساسي</span></div></div><div class="bd">${h}</div><div class="ft"><span class="lt">المعلم: أ. أمين عبدالرازق أبوطلال</span><span class="mt">${MT[i]}</span><span>${A(i+1)} / ${A(N)}</span></div></section>`).join('');
document.addEventListener('click',e=>{
if(map){const s=e.target.closest('.sc');if(s){go(+s.dataset.i);return}}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a=='next')go(cur+1);else if(a=='prev')go(cur-1);else if(a=='map'){map=!map;cam()}
else if(a=='zin'){zoom=Math.min(2,zoom+.2);cam()}else if(a=='zout'){zoom=Math.max(.6,zoom-.2);cam()}
else if(a=='home'){seen=new Set([0]);qi=0;qs=0;wrong=[];quiz();document.querySelectorAll('.ans').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.lab').forEach(l=>l.outerHTML=LAB(+l.dataset.k));document.querySelectorAll('.sim').forEach(initSim);document.querySelectorAll('.opts button').forEach(x=>x.className='');document.querySelectorAll('.fb').forEach(x=>x.textContent='');go(0)}
else if(a=='go')go(+b.dataset.n);
else if(a=='fs'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}}
else if(a=='rev'){const d=b.nextElementSibling;d.classList.toggle('show');b.textContent=d.classList.contains('show')?'أخفِ الإجابة':'اكشف الإجابة'}
else if(a=='opt'){const m=b.closest('.mq'),q=ACT[+m.dataset.i].mq,o=+b.dataset.o;m.querySelectorAll('button').forEach((x,j)=>{x.className=j==q[2]?'ok':(x==b?'no':'')});m.querySelector('.fb').className='fb '+(o==q[2]?'g':'r');m.querySelector('.fb').textContent=o==q[2]?'إجابة صحيحة، أحسنت!':'ليست صحيحة. الإجابة الصحيحة: '+q[1][q[2]]}
else if(a=='qo'){const x=Q[qi],o=+b.dataset.o,box=$('#quiz');if(box.dataset.l==qi)return;box.dataset.l=qi;
box.querySelectorAll('.opts button').forEach((y,j)=>y.className=j==x[2]?'ok':(y==b?'no':''));
if(o==x[2])qs++;else wrong.push(x[0]+' ← '+x[1][x[2]]);
box.querySelector('.fb').className='fb '+(o==x[2]?'g':'r');box.querySelector('.fb').innerHTML=(o==x[2]?'إجابة صحيحة! ':'الإجابة الصحيحة: '+x[1][x[2]]+'. ')+x[3]+'<br><button data-a="qn" style="margin-top:8px">'+(qi==Q.length-1?'اعرض النتيجة':'السؤال التالي')+'</button>'}
else if(a=='qn'){qi++;$('#quiz').dataset.l='';quiz()}
else if(a=='qr'){qi=0;qs=0;wrong=[];quiz()}else if(a=='lr'){const l=b.closest('.lab');l.outerHTML=LAB(+l.dataset.k)}else if(a=='sr')initSim(b.closest('.sim'));});
document.addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft')go(cur+1);else if(k=='ArrowRight')go(cur-1);else if(k=='Escape'||k=='m'){map=!map;cam()}else if(k=='+'){zoom=Math.min(2,zoom+.2);cam()}else if(k=='-'){zoom=Math.max(.6,zoom-.2);cam()}else if(k=='Home')go(0)});
let drag=null;const zoneAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('.zone')};
function mv(e){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';document.querySelectorAll('.zone.hov').forEach(z=>z.classList.remove('hov'));const z=zoneAt(e);if(z)z.classList.add('hov')}
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.chip');if(!c||map||c.closest('.zone'))return;e.preventDefault();const g=c.cloneNode(true);g.classList.add('gh');document.body.appendChild(g);drag={c,g};mv(e)});
document.addEventListener('pointermove',e=>{if(drag)mv(e)});
function endDrag(e,ok){if(!drag)return;const z=ok?zoneAt(e):null;drag.g.remove();document.querySelectorAll('.zone.hov').forEach(x=>x.classList.remove('hov'));const c=drag.c;drag=null;if(z)drop(c,z)}
document.addEventListener('pointerup',e=>endDrag(e,1));document.addEventListener('pointercancel',e=>endDrag(e,0));
function drop(c,z){const lab=c.closest('.lab');if(!lab||z.closest('.lab')!==lab)return;const L=LABS[+lab.dataset.k],j=+c.dataset.j,zi=+z.dataset.z,lm=lab.querySelector('.lm'),r=L.r(j,zi);lm.className='lm '+(r[0]?'g':'r');lm.textContent=r[1];
if(!r[0]){z.classList.remove('bad');void z.offsetWidth;z.classList.add('bad');return}
const f=L.fx&&L.fx(j,zi);if(f=='rise')z.classList.add('up');if(f=='oil'&&!z.querySelector('.oil'))z.insertAdjacentHTML('beforeend','<i class="oil"></i>');if(f=='heat')z.classList.add('heated');
if(L.keep){z.appendChild(c);lab.dataset.n=(+lab.dataset.n||0)+1;if(+lab.dataset.n==L.i.length)lm.textContent+=' '+(L.done||'أحسنت! أكملتَ المهمة بنجاح.')}}
function layout(){const vp=$('#vp'),pt=false,st=$('#st');W=pt?760:1100;H=pt?1180:800;GX=W+150;GY=H+120;st.classList.toggle('pt',pt);st.style.width=(3*GX+W)+'px';st.style.height=(4*GY+H)+'px';document.querySelectorAll('.sc').forEach((s,i)=>{s.style.left=(3-i%4)*GX+'px';s.style.top=Math.floor(i/4)*GY+'px';s.style.width=W+'px';s.style.height=H+'px'})}
addEventListener('resize',()=>{layout();cam()});let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(!map&&Math.abs(dx)>110&&Math.abs(dy)<60)go(cur+(dx<0?1:-1))},{passive:true});
if(!document.documentElement.requestFullscreen)$('#fsb').style.display='none';
document.querySelectorAll('.sim').forEach(initSim);quiz();layout();cam();
</script>
</body>
</html>
